# REQ-P-006 — ClusterConfig de EKS. Render: scripts/render-cluster-config.sh (sustituye ${AWS_ACCOUNT_ID}).
# La access entry del rol de GitHub Actions se crea tras `terraform apply`:
#   eksctl create accessentry -f .harness/cluster.rendered.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: biblioteca-eks
  region: us-east-1
  version: "1.37"
  tags:
    Project: biblioteca
    ManagedBy: eksctl

availabilityZones: [us-east-1a, us-east-1b]

vpc:
  cidr: 10.10.0.0/16
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  withOIDC: true

accessConfig:
  authenticationMode: API
  bootstrapClusterCreatorAdminPermissions: true
  accessEntries:
    - principalARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/biblioteca-github-actions
      accessPolicies:
        - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          accessScope:
            type: namespace
            namespaces: [biblioteca]

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy": "true"}'
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  - name: ng-default
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    labels:
      role: general
    tags:
      Project: biblioteca
