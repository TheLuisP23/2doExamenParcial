# REQ-P-008, REQ-P-009 — BD dentro del clúster, una por servicio (REQ-SYS-002)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: biblioteca
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: biblioteca
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
    spec:
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: books }
            - { name: POSTGRES_USER, value: books }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "books", "-d", "books"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "books", "-d", "books"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: biblioteca
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mongo }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: biblioteca
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: biblioteca, app.kubernetes.io/component: database }
    spec:
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mongo
          image: mongo:7.0
          ports: [{ containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-credentials, key: password } }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 10Gi } }
