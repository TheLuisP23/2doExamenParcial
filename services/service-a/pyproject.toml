[project]
name = "books"
version = "0.1.0"
description = "Servicio A — catálogo de libros (specs/001-servicio-a)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "mypy>=1.13",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/books"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): requisitos REQ-* que verifica la prueba"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["books"]
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/books/repository/migrations/**" = ["E501"]
